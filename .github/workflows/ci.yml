name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  user-api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/user-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: apps/user-api/go.sum
      - run: go build -o /dev/null ./...
      - run: go vet ./...

  forecast-api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/forecast-api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: apps/forecast-api/uv.lock
      - run: uv sync --frozen
      - run: uv run ruff check .
      # full-epoch parity tests (~3 min CPU) run with `-m slow` locally
      - run: uv run pytest -m "not slow"
